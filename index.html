<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokédex Nacional</title>
<style>
:root{--red:#e53935;--ink:#172554;--bg:#f2f7ff;--line:#dbe5f4}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#eaf5ff,#fff 55%,#fff1f1);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172554}.top{background:linear-gradient(120deg,#e53935,#f45b55);color:white;padding:26px 18px 30px;border-bottom:6px solid #172554}.wrap{max-width:1200px;margin:auto}.brand{display:flex;align-items:center;gap:12px}.ash-hat{width:58px;height:48px;flex-shrink:0;filter:drop-shadow(0 2px 2px #7f1d1d55)}.ash-hat svg{width:100%;height:100%;display:block}.ball{width:48px;height:48px;border:4px solid white;border-radius:50%;background:linear-gradient(to bottom,#fff 0 45%,#172554 45% 55%,#fff 55%);position:relative;flex-shrink:0}.ball:after{content:'';position:absolute;width:13px;height:13px;background:white;border:4px solid #172554;border-radius:50%;top:13px;left:13px}.top h1{margin:0;font-size:clamp(1.7rem,5vw,3rem);line-height:1}.top p{margin:10px 0 0;opacity:.95}.content{max-width:1200px;margin:auto;padding:22px 16px}.tools{display:grid;grid-template-columns:1fr 190px 150px;gap:10px;margin-bottom:14px}input,select,button{font:inherit;border:1px solid #cbd5e1;border-radius:12px;padding:12px;background:white;color:#172554}input:focus,select:focus{outline:3px solid #bfdbfe}.status{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#475569;font-size:.92rem;margin:12px 2px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px;text-align:center;box-shadow:0 5px 15px #1725540c;position:relative;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 22px #17255418}.num{font-size:.78rem;color:#64748b;font-weight:800}.pokeimg{width:100%;max-width:135px;aspect-ratio:1;object-fit:contain;display:block;margin:2px auto}.name{font-weight:800;text-transform:capitalize;margin:2px 0 8px}.types{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}.type{font-size:.68rem;color:white;padding:4px 8px;border-radius:99px;font-weight:800;text-transform:capitalize}.fav{position:absolute;right:8px;top:7px;border:0;background:#fff0;padding:4px 7px;font-size:1.25rem;cursor:pointer}.fav.on{color:#e11d48}.empty{padding:35px;text-align:center;background:white;border-radius:16px}.footer{text-align:center;color:#64748b;padding:25px;font-size:.85rem}.loadmore{display:block;margin:24px auto;border:0;background:#172554;color:white;font-weight:800;padding:13px 24px;cursor:pointer}.loadmore:disabled{opacity:.5}.tiny{font-size:.8rem;color:#64748b}@media(max-width:650px){.tools{grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:9px}.pokeimg{max-width:115px}}
</style></head>
<body><header class="top"><div class="wrap"><div class="brand"><div class="ash-hat" role="img" aria-label="Gorra de Ash"><svg viewBox="0 0 100 72" xmlns="http://www.w3.org/2000/svg"><path d="M13 43C15 21 31 8 51 8c20 0 31 12 34 31L60 47 13 43Z" fill="#e53935" stroke="#172554" stroke-width="4" stroke-linejoin="round"/><path d="M34 13c7-4 17-5 25-2l-2 27-25-2Z" fill="#f8fafc" stroke="#172554" stroke-width="3"/><path d="M12 42c19 3 43 3 70-2 7-1 12 2 10 6-4 9-31 17-57 13C17 56 6 50 8 46c0-2 2-3 4-4Z" fill="#2563eb" stroke="#172554" stroke-width="4" stroke-linejoin="round"/><path d="M45 18l5 6-5 6-5-6Z" fill="#22c55e" stroke="#172554" stroke-width="2"/></svg></div><div class="ball" aria-label="Pokébola"></div><div><h1>Pokédex Nacional</h1><p>¡Explorá el mundo Pokémon, uno por uno!</p></div></div></div></header>
<main class="content"><div class="tools"><input id="search" type="search" placeholder="🔎 Buscar por nombre o número…" aria-label="Buscar Pokémon"><select id="gen" aria-label="Elegir generación"><option value="all">Todas las generaciones</option><option value="1">Generación I · Kanto</option><option value="2">Generación II · Johto</option><option value="3">Generación III · Hoenn</option><option value="4">Generación IV · Sinnoh</option><option value="5">Generación V · Teselia</option><option value="6">Generación VI · Kalos</option><option value="7">Generación VII · Alola</option><option value="8">Generación VIII · Galar</option><option value="9">Generación IX · Paldea</option></select><select id="mode" aria-label="Filtrar favoritos"><option value="all">Todos</option><option value="fav">⭐ Favoritos</option></select></div><div class="status"><span id="count">Preparando la Pokédex…</span><span class="tiny">Las imágenes y los datos necesitan conexión a internet.</span></div><section id="grid" class="grid" aria-live="polite"></section><button id="more" class="loadmore" hidden>Mostrar más Pokémon</button><div id="msg" class="empty" hidden></div></main><footer class="footer">Hecho para fans Pokémon 💛 · Datos e imágenes cargados desde PokéAPI y Pokémon sprites.</footer>
<script>
const $=s=>document.querySelector(s);const grid=$('#grid'),search=$('#search'),gen=$('#gen'),mode=$('#mode'),count=$('#count'),more=$('#more'),msg=$('#msg');let all=[],shown=0,step=60,favs=new Set(JSON.parse(localStorage.getItem('pokedex-favs')||'[]'));const starts=[1,152,252,387,494,650,722,810,906,1026];const ends=[151,251,386,493,649,721,809,905,1025,1200];
const typeEs={normal:'normal',fire:'fuego',water:'agua',electric:'eléctrico',grass:'planta',ice:'hielo',fighting:'lucha',poison:'veneno',ground:'tierra',flying:'volador',psychic:'psíquico',bug:'bicho',rock:'roca',ghost:'fantasma',dragon:'dragón',dark:'siniestro',steel:'acero',fairy:'hada'};
const typeColors={normal:'#929aa6',fire:'#f16b3a',water:'#369ce6',electric:'#e9b91d',grass:'#4cae61',ice:'#57c7d8',fighting:'#c94e4e',poison:'#a34eb1',ground:'#bd9252',flying:'#6c9ee8',psychic:'#e45b9b',bug:'#8a9f28',rock:'#9b8155',ghost:'#6c5b9b',dragon:'#5263ce',dark:'#55515b',steel:'#71889b',fairy:'#df8eb5'};
function genOf(id){for(let i=0;i<9;i++)if(id>=starts[i]&&id<=ends[i])return i+1;return 9}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function visible(){let q=search.value.trim().toLowerCase(),g=gen.value,f=mode.value;return all.filter(p=>(g==='all'||genOf(p.id)===+g)&&(f!=='fav'||favs.has(p.id))&&(!q||String(p.id).includes(q)||p.name.includes(q)||p.es.toLowerCase().includes(q)))}
function render(reset=false){if(reset)shown=0;const list=visible(),slice=list.slice(0,shown+step);grid.innerHTML=slice.map(p=>`<article class="card"><button class="fav ${favs.has(p.id)?'on':''}" title="${favs.has(p.id)?'Quitar de favoritos':'Agregar a favoritos'}" aria-label="Favorito" data-fav="${p.id}">${favs.has(p.id)?'★':'☆'}</button><div class="num">N.º ${String(p.id).padStart(4,'0')}</div><img class="pokeimg" loading="lazy" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.id}.png" alt="${esc(p.name)}" onerror="this.style.opacity='.25';this.alt='Imagen no disponible'"><div class="name">${esc(p.es||p.name)}</div><div class="types">${p.types.map(t=>`<span class="type" style="background:${typeColors[t]||'#64748b'}">${typeEs[t]||t}</span>`).join('')}</div></article>`).join('');count.textContent=`${list.length.toLocaleString('es-AR')} Pokémon encontrados · mostrando ${Math.min(slice.length,list.length)}`;more.hidden=slice.length>=list.length;msg.hidden=list.length!==0;if(!list.length)msg.textContent='No encontramos Pokémon con esos filtros. ¡Probá otra búsqueda!';more.disabled=false;more.textContent='Mostrar más Pokémon';}
grid.addEventListener('click',e=>{const b=e.target.closest('[data-fav]');if(!b)return;const id=+b.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem('pokedex-favs',JSON.stringify([...favs]));render(true)});[search,gen,mode].forEach(el=>el.addEventListener(el===search?'input':'change',()=>render(true)));more.addEventListener('click',()=>{shown+=step;render(false)});
(async()=>{try{const r=await fetch('https://pokeapi.co/api/v2/pokemon?limit=1025');if(!r.ok)throw Error('API');const d=await r.json();count.textContent='Cargando nombres y tipos…';const data=await Promise.all(d.results.map(async(x,i)=>{const id=i+1;try{const rr=await fetch(x.url);const p=await rr.json();return{id,name:p.name,es:p.name,types:p.types.map(t=>t.type.name)}}catch{return{id,name:x.name,es:x.name,types:[]}}}));all=data;count.textContent='¡Pokédex lista!';render(true)}catch(e){count.textContent='No se pudo conectar con la Pokédex.';msg.hidden=false;msg.innerHTML='Para cargar los Pokémon, abrí esta página con conexión a internet y volvé a intentarlo.<br><br><button onclick="location.reload()">Reintentar</button>';more.hidden=true}})();
</script></body></html>
